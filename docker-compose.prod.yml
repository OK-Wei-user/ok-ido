# ============================================================================
# I-DO - 生产环境 Docker Compose 编排
# 包含全部服务：redis / postgres / sandbox / mcp-multimodal / searxng / api / ui / nginx
# 仅对外暴露 Nginx 80/443 端口，其余服务仅在内部网络通信
# 使用方式：docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================

services:
  # ----------------------------------------------------------------------------
  # 基础设施层
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2.4
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --timeout 0
      --tcp-keepalive 60
    volumes:
      - redis_data:/data
    networks:
      - IDO-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-manus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - IDO-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-manus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # 沙箱镜像构建（不在编排中常驻运行，由 api 通过 Docker SDK 动态创建/销毁）
  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: sandbox:latest
    container_name: sandbox
    restart: "no"
    networks:
      - IDO-network

  mcp-multimodal:
    build:
      context: ./mcp-multimodal
      dockerfile: Dockerfile
    image: mcp-multimodal:latest
    container_name: mcp-multimodal
    restart: unless-stopped
    environment:
      MULTIMODAL_API_KEY: ${MULTIMODAL_API_KEY:-}
      MULTIMODAL_BASE_URL: ${MULTIMODAL_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      MULTIMODAL_VL_MODEL: ${MULTIMODAL_VL_MODEL:-glm-4.6v}
      MULTIMODAL_IMAGE_MODEL: ${MULTIMODAL_IMAGE_MODEL:-cogview-4}
      MULTIMODAL_ASR_MODEL: ${MULTIMODAL_ASR_MODEL:-glm-asr-2512}
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "9100"
    networks:
      - IDO-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9100/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-searxng-IDO-secret}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - IDO-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 应用层
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: api:latest
    container_name: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mcp-multimodal:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - IDO-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    image: ui:latest
    container_name: ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - IDO-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 网关层
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy
    networks:
      - IDO-network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  IDO-network:
    name: IDO-network
    driver: bridge
