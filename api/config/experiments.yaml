# 实验配置(Batch 40 / 方向2: 预算调整策略 A/B 测试)
#
# 实验目的: 验证不同预算调整幅度对任务完成率的影响
# 数据积累: 需 2-4 周 E2E 数据积累才能得出统计显著结论
#
# 分组策略: hash(session_id) % 100 < split → control, 否则 variant_a
# 降级策略: 配置文件缺失/解析失败时使用 budget_tracker 默认硬编码值

budget_adjustment_v1:
  enabled: false  # 设为 true 启用 A/B 实验(需积累足够数据后开启)
  groups:
    # 控制组: 当前 Batch 39 的经验值(+1/+2/+5)
    control:
      research:
        deep_research: 1
      data_analysis:
        search_web: 2
      browser:
        browser_navigate: 5
    # 实验组A: 更激进的上调(+2/+1/+3),验证是否提高完成率
    variant_a:
      research:
        deep_research: 2
      data_analysis:
        search_web: 1
      browser:
        browser_navigate: 3
  split: 50  # control 组占比(%)
