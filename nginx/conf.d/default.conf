# ============================================================================
# I-DO Nginx 站点配置
# - HTTP(80)：开箱即用，反代 ui(3000) 与 api(8000)
# - HTTPS(443)：按需启用，需提供 ssl/fullchain.pem 与 ssl/privkey.pem
# ============================================================================

upstream ui_backend {
    server ui:3000;
    keepalive 32;
}

upstream api_backend {
    server api:8000;
    keepalive 32;
}

# ----------------------------------------------------------
# HTTP 入口（默认启用）
# ----------------------------------------------------------
server {
    listen 80;
    server_name _;

    # 如已启用 HTTPS，可在此处做 301 跳转：
    # return 301 https://$host$request_uri;

    # API 接口代理（含 WebSocket / SSE 支持）
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # WebSocket 支持（VNC 远程桌面等）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 标准代理头
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接：关闭缓冲，保证事件实时推送
        proxy_buffering    off;
        proxy_cache        off;

        # 长超时（WebSocket 与 SSE 需要保持连接）
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 60s;

        # 文件上传大小限制
        client_max_body_size 100m;
    }

    # 前端 UI 代理
    location / {
        proxy_pass http://ui_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR WebSocket（生产环境可保留，无副作用）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

